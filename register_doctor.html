<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - CareClinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="flex-center py-4">
    <div class="container" style="max-width: 450px;">
        <div class="card" style="border-top: 4px solid var(--secondary);">
            <div class="card-header">
                <h2 class="card-title">Doctor Registration</h2>
                <p>Join CareClinic as a healthcare provider</p>
            </div>

            <form id="registerForm">
                <input type="hidden" name="role" value="doctor">
                
                <div id="errorMsg" class="alert alert-danger hidden"></div>
                <div id="successMsg" class="alert alert-success hidden">Registration successful! Redirecting...</div>

                <div class="form-group">
                    <label class="form-label">Full Name (with Title)</label>
                    <input type="text" name="name" placeholder="Dr. John Doe" required class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" required class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" required minlength="6" class="form-control">
                </div>

                <button type="submit" class="btn btn-secondary btn-block mt-2">Register as Doctor</button>
            </form>

            <p class="text-center mt-3">
                Already have an account? <a href="login_doctor.html" style="color: var(--secondary); font-weight: 600;">Login here</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        
        errorMsg.classList.add('hidden');
        successMsg.classList.add('hidden');

        try {
            const response = await fetch('api/register.php', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if(data.success) {
                successMsg.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = 'login_doctor.html';
                }, 1500);
            } else {
                errorMsg.textContent = data.message || "Registration failed.";
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            errorMsg.textContent = "An error occurred. Please try again.";
            errorMsg.classList.remove('hidden');
        }
    });
</script>

</body>
</html>
