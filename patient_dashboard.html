    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - CareClinic</title>

</head>

<nav class="navbar patient-nav">
    <div class="container">
        <div class="navbar-brand">CareClinic Patient</div>
        <div class="nav-links">
            <a href="book_appointment.html" class="btn btn-sm" style="background: rgba(255,255,255,0.2); color: white; border: none;">Book Appointment</a>
            <button onclick="logout()" class="btn btn-sm" style="background: white; color: var(--primary);">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>My Appointments</h1>
        <a href="book_appointment.html" class="btn btn-primary">Book New</a>
    </div>

    <div class="card">
        <div id="appointmentsList">
            <p>Loading appointments...</p>
        </div>
    </div>
</div>

<script>

    async function loadAppointments() {
    try {
        const res = await fetch('api/get_appointments.php');
        const data = await res.json();
        
        const container = document.getElementById('appointmentsList');
        if (!container) return;
        container.innerHTML = '';
        
        if (data.success) {
            if (!data.appointments || data.appointments.length === 0) {
                container.innerHTML = '<p class="text-center">No appointments scheduled.</p>';
                return;
            }
            
            data.appointments.forEach(app => {
                // Defensive check for doctor_name and symptoms
                let docName = app.doctor_name || "Unknown Doctor";
                let symptoms = app.symptoms || "None provided";
                let time = app.time_slot || "TBD";
                
                // Clean 'Dr.' prefix
                let displayName = docName.toLowerCase().startsWith('dr.') ? docName : 'Dr. ' + docName;

                container.innerHTML += `
                    <div class="list-item">
                        <div>
                            <div class="list-title">${displayName}</div>
                            <div class="list-subtitle">${app.appointment_date} at ${time}</div>
                            <div style="font-size: 0.8rem; color: #666;">Symptoms: ${symptoms}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="status-pending">${app.status}</div>
                            <a href="api/generate_pdf.php?id=${app.id}" target="_blank" style="font-size: 0.75rem;">Download PDF</a>
                        </div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = `<p class="alert alert-danger">${data.message}</p>`;
        }
    } catch (e) {
        console.error("Dashboard Error:", e);
        document.getElementById('appointmentsList').innerHTML = '<p class="alert alert-danger">Failed to parse server response.</p>';
    }
}
