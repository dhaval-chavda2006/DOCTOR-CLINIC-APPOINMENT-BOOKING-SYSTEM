<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - CareClinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="flex-center py-4">
    <div class="container" style="max-width: 450px;">
        <div class="card" style="border-top: 4px solid var(--secondary);">
            <div class="card-header">
                <h2 class="card-title">Doctor Portal</h2>
                <p>Sign in to manage your appointments</p>
            </div>

            <form id="loginForm">
                <input type="hidden" name="role" value="doctor">
                
                <div id="errorMsg" class="alert alert-danger hidden"></div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" required class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" required class="form-control">
                </div>

                <button type="submit" class="btn btn-secondary btn-block mt-2">Login as Doctor</button>
            </form>

            <p class="text-center mt-3">
                New Doctor? <a href="register_doctor.html" style="color: var(--secondary); font-weight: 600;">Register here</a>
            </p>
            <p class="text-center mt-2" style="font-size: 0.875rem;">
                <a href="index.html" style="color: var(--text-muted);">← Back to Home</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const errorMsg = document.getElementById('errorMsg');
        
        try {
            const response = await fetch('api/login.php', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if(data.success) {
                window.location.href = 'doctor_dashboard.php';
            } else {
                errorMsg.textContent = data.message;
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            errorMsg.textContent = "An error occurred. Please try again.";
            errorMsg.classList.remove('hidden');
        }
    });
</script>

</body>
</html>
